version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      - DB_MULTI_PATH=/app/data/geocoding_multi.db
      - DB_GEO_PATH=/app/data/geocoding.db
    expose:
      - "8000"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: 
        BACKEND_URL: 
    environment:
      - NEXT_PUBLIC_API_URL=
      - BACKEND_URL=http://backend:8000
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  driver-app:
    build:
      context: .
      dockerfile: motoristas_webapp/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  sqlite_data:
