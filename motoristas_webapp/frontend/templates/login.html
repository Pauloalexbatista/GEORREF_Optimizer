<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - AppGeoRoutePlan</title>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="manifest" href="/static/manifest.json">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-icon">📍</div>
      <div class="brand-name" data-i18n="app_title">AppGeoRoutePlan</div>
    </div>
    <div class="header-controls">
      <select id="lang-select" class="lang-select">
        <option value="pt">🇵🇹 PT</option>
        <option value="en">🇬🇧 UK</option>
        <option value="es">🇪🇸 ES</option>
        <option value="fr">🇫🇷 FR</option>
      </select>
      <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="app-content" style="display:flex; align-items:center; justify-content:center; padding-top: 30px;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 24px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 40px; margin-bottom: 8px;">🚚</div>
        <h1 style="font-size: 20px; font-weight: 800;" data-i18n="login_title">Entrar na Aplicação</h1>
        <p style="font-size: 13px; color: var(--text-secondary);" data-i18n="login_subtitle">Gestão e Distribuição Diária</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="password" data-i18n="password_label">Senha de Acesso</label>
          <input type="password" id="password" class="form-input" data-i18n-placeholder="password_placeholder" placeholder="Insira a sua senha ou PIN..." required autofocus>
        </div>

        <div id="login-error-msg" style="display:none; margin-bottom: 12px; font-size: 13px; color: #dc2626; background: #fee2e2; padding: 8px; border-radius: var(--radius-sm); text-align:center;" data-i18n="login_error">
          Senha incorreta. Tente novamente.
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block" data-i18n="btn_enter">
          Entrar
        </button>
      </form>
      
      <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center;">
        <a href="/api/template" class="btn btn-secondary btn-block" style="font-size:12px; min-height:36px; text-decoration:none;">
          📄 <span data-i18n="btn_download_template">Descarregar Modelo Excel</span>
        </a>
      </div>
    </div>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwd = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("login-error-msg");
      const btn = document.getElementById("btn-submit");
      
      errorMsg.style.display = "none";
      btn.disabled = true;
      
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd })
        });
        
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.role === "manager") {
            localStorage.setItem("geo_role", "manager");
            window.location.href = "/manager";
          } else if (data.role === "driver") {
            localStorage.setItem("geo_role", "driver");
            localStorage.setItem("geo_driver", JSON.stringify(data));
            window.location.href = "/driver";
          }
        } else {
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
